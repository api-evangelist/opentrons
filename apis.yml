apis:
- name: Opentrons Python Protocol API
  description: >-
    The Opentrons Python Protocol API is an open-source Python framework for writing automated biology
    lab protocols that run on Opentrons Flex and OT-2 robots. It provides programmatic control over pipettes,
    labware, deck configuration, hardware modules (thermocyclers, heater-shakers, temperature modules,
    magnetic modules, absorbance readers), and supports dynamic decision-making and custom integrations.
    Protocols are executed by the robot server and can be controlled via the HTTP API or Opentrons App.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
